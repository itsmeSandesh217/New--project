<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In Page</title>
    <link rel="stylesheet" href="./login.css">
</head>
<body>
<div class="login-container">
    <h2 class="login-tittle">LogIn</h2>
    <br>
    <form>
        <div class="form-group">
            <label class="form-label" for="email">Email</label>
            <input class="form-input" type="email" id="email"  placeholder="Enter your email"required>
        </div>
        <div class="password-form">
            <label class="form-label" for="Password">Password</label>
            <input class="form-input" type="email" id="Password"  placeholder="Enter your password"required>
        </div>


        <div>
            <button class="login-button" type="submit">Sumit</button>

            <a class="forget-password" href="#">Forget Password</a>

        </div>
    </form>

    
</div>
</body>
</html>
