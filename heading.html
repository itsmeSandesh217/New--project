<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heading</title>
</head>
<style>
  /* =========================
   RESET
========================= */


* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, Helvetica, sans-serif;
}


/* =========================
   HEADER
========================= */

#header-site {
    width: 100%;
    background-color: #111827;

    position: sticky;
    top: 0;
    z-index: 1000;

    box-shadow: 0 2px 10px rgb.header-wrapper {
    display: flex;
    justify-content: center;
    align-items: center;
}

.logo img {
    width: 90px;
    height: 90px;
    object-fit: cover;
}
a(0, 0, 0, 0.15);
}

.header-wrapper {
    width: 90%;
    max-width: 1200px;

    min-height: 80px;

    margin: 0 auto;

    display: flex;
    align-items: center;
    justify-content: space-between;
}


/* =========================
   LOGO
========================= */

.logo {
    display: flex;
    align-items: center;
}

.logo img {
    width: 70px;
    height: 70px;

    object-fit: cover;

    display: block;

    border-radius: 50%;

    border: 3px solid #ffffff;
}


/* =========================
   NAVIGATION
========================= */

.header-wrapper nav ul {
    display: flex;
    align-items: center;
    gap: 35px;

    list-style: none;
}

.header-wrapper nav ul li a {
    color: #ffffff;

    font-size: 16px;
    font-weight: 500;

    text-decoration: none;

    position: relative;

    padding: 10px 0;

    transition: color 0.3s ease;
}


/* Underline animation */

.header-wrapper nav ul li a::after {
    content: "";

    position: absolute;

    left: 0;
    bottom: 0;

    width: 0;
    height: 2px;

    background-color: #3b82f6;

    transition: width 0.3s ease;
}

.header-wrapper nav ul li a:hover {
    color: #60a5fa;
}

.header-wrapper nav ul li a:hover::after {
    width: 100%;
}


/* =========================
   RESPONSIVE
========================= */

@media (max-width: 768px) {

    .header-wrapper {
        min-height: auto;

        flex-direction: column;

        gap: 20px;

        padding: 20px 0;
    }

    .header-wrapper nav ul {
        gap: 20px;
        flex-wrap: wrap;
        justify-content: center;
    }
}


@media (max-width: 480px) {

    .logo img {
        width: 60px;
        height: 60px;
    }

    .header-wrapper nav ul {
        gap: 15px;
    }

    .header-wrapper nav ul li a {
        font-size: 14px;
    }
}

</style>
<body>

    
     <header id="header-site">

        <div class="header-wrapper">

            

            <div class="logo">
                <img src="https://img.magnific.com/premium-photo/most-amazing-realistic-hd-8k-wallpaper-stock-photographic-image_915071-51074.jpg?semt=ais_hybrid&w=740&q=80" alt="logo" length="90" width="90">
            </div>
    


        <div>
            <nav>
                <ul>
                    <li><a href="#home">Home</a></li>
                    <li><a href="#Portfolio">Portfolio</a></li>
                    <li><a href="#Newspaper">Newspaper</a></li>
                    <li><a href="#Client">Client</a></li>
                </ul>
            </nav>
            </div>

    </header>


    
</body>
</html>
