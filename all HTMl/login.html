<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form>
        <div class="form-feild">
            <p>
            <h3>Student Registration Form</h3>
            </p><br>
            <br>
            <label for="Roll No">Roll No</label>
            <input type="Roll No" name="Roll No" id="Roll No">
        </div>

        <div class="form-feild">
            <label for="Student Name">Student Name</label>
            <input type="Student Name" name="Student Name" id="Student Name">
        </div>


        <div class="form-feild">
            <label for="Fathers Name">Fathers Name</label>
            <input type="Fathers Name" name="Fathers Name" id="Fathers Name">
        </div>


        <div class="form-feild">
            <label for="Date of birth">Date Of Birth</label>
            <input type="Date OF Birth" name="Date Of Birth" id="Date Of Birth">
        </div>

        <div class="form-feild">
            <label for="email">Email :</label>
            <input type="email" name="email" id="email" placeholder="example@gmail.com">
        </div>

        <div class="form-feild">
            <label for="psw">Password : </label>
            <input type="password" name="password" id="psw" placeholder="*********">
        </div>

        <div class="form-feild">
            <button type="submit">Login</button>
        </div>

    </form>
</body>

</html>
